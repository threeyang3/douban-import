name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check:manifest
      - run: npm run build
      - run: npm test -- --runInBand
      - run: npm run docs:build
      - run: git diff --check
      - name: Upload installable development build
        uses: actions/upload-artifact@v4
        with:
          name: douban-import
          retention-days: 14
          if-no-files-found: error
          path: |
            main.js
            manifest.json
            styles.css
            LICENSE
            PROVENANCE.md
