name: Release Draft
on:
  push:
    tags: ['[0-9]*.[0-9]*.[0-9]*']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check:manifest
      - run: npm run build
      - run: npm test -- --runInBand
      - name: Create draft with plugin assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" main.js manifest.json styles.css LICENSE PROVENANCE.md --verify-tag --draft --title "$GITHUB_REF_NAME" --generate-notes
